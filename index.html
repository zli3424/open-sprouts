<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Sprouts App Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one iPhone-sized column, five tabs, quiet sage cards. The plants' faces carry the colour. */
  --bg:#EDF2EA; --surface:#FFFFFF; --surface-2:#E0E9DD; --line:#D2DDCF;
  --ink:#13251B; --ink-2:#56685C;
  --leaf:#1B7A46; --on-leaf:#FFFFFF; --leaf-soft:#D4EDDB; --leaf-ink:#145C35;
  --sun:#F2B01E; --sun-soft:#FBEDC2; --sun-ink:#7A4E00;
  --water:#2B7FCC; --water-soft:#DAEAFA; --water-ink:#1B5C99;
  --alert:#D2433A; --alert-soft:#FBE1DD; --alert-ink:#9C2A22;
  --stage:#D7E1D4; --bezel:#0B100D;
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Figtree',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --r:18px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1712; --surface:#16241C; --surface-2:#203227; --line:#2B3F32;
    --ink:#E7F1E9; --ink-2:#9BAFA1;
    --leaf:#4CC27F; --on-leaf:#08140D; --leaf-soft:#1B3A29; --leaf-ink:#8FE0B0;
    --sun:#F5C04A; --sun-soft:#3A3013; --sun-ink:#F6D680;
    --water:#5AA9EE; --water-soft:#17304A; --water-ink:#9CCBF6;
    --alert:#F0695E; --alert-soft:#42201C; --alert-ink:#FFA9A1;
    --stage:#050A07; --bezel:#000;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1712; --surface:#16241C; --surface-2:#203227; --line:#2B3F32;
  --ink:#E7F1E9; --ink-2:#9BAFA1;
  --leaf:#4CC27F; --on-leaf:#08140D; --leaf-soft:#1B3A29; --leaf-ink:#8FE0B0;
  --sun:#F5C04A; --sun-soft:#3A3013; --sun-ink:#F6D680;
  --water:#5AA9EE; --water-soft:#17304A; --water-ink:#9CCBF6;
  --alert:#F0695E; --alert-soft:#42201C; --alert-ink:#FFA9A1;
  --stage:#050A07; --bezel:#000;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font:400 15px/1.4 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:2.5px solid var(--water);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;letter-spacing:-.01em}
svg{display:block}
[hidden]{display:none!important}

/* Phone shell */
.stage{height:100%;display:flex;align-items:center;justify-content:center;padding:12px}
.phone{width:390px;max-width:100%;height:min(844px,100%);max-height:100%;flex:none;background:var(--bg);border:10px solid var(--bezel);border-radius:52px;overflow:hidden;overflow:clip;position:relative;display:flex;flex-direction:column;box-shadow:0 30px 60px -30px rgba(0,0,0,.45)}
.statusbar{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font-weight:600;font-size:15px;position:relative;z-index:3}
.statusbar .island{position:absolute;left:50%;top:9px;transform:translateX(-50%);width:104px;height:28px;border-radius:16px;background:#000}
.statusbar .sys{display:flex;gap:6px;align-items:center}
.phone.cammode .statusbar{background:#000;color:#fff}
.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;padding-bottom:20px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.is-cam{padding:0;overflow:hidden;overflow:clip}
.screen.enter>*{animation:push .22s ease-out}
@keyframes push{from{transform:translateX(14px);opacity:.4}to{transform:none;opacity:1}}
@media (max-width:480px){
  .stage{padding:0}
  .phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
  .statusbar{display:none}
}

/* Tab bar */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px 14px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-2);padding:4px 0;border-radius:12px}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--leaf)}
.tabbar button.scan span.ring{width:46px;height:46px;border-radius:50%;background:var(--leaf);color:var(--on-leaf);display:grid;place-items:center;margin-top:-18px;border:4px solid var(--surface)}
.tabbar button.scan.on span.ring{background:var(--ink);color:var(--bg)}

/* Headers */
.lt{display:flex;justify-content:space-between;align-items:flex-end;padding:10px 20px 12px;gap:12px}
.lt h1{font-size:32px;font-weight:800;line-height:1.05}
.eyebrow{font-size:13px;font-weight:600;color:var(--ink-2)}
.nav{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.nav .back{display:inline-flex;align-items:center;gap:2px;color:var(--leaf);font-weight:600;padding:6px 4px;justify-self:start}
.nav .back svg{width:20px;height:20px}
.nav-title{font-family:var(--display);font-weight:700;font-size:17px;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-right{justify-self:end}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--leaf);flex:none}
.iconbtn svg{width:20px;height:20px}
.pad{padding:0 16px}
.stack{display:flex;flex-direction:column;gap:12px}
.sec{padding:0 16px;margin-top:22px}
.sec>h2{font-size:20px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec>h2 small{font:600 13px var(--body);color:var(--ink-2)}
.sub{color:var(--ink-2);font-size:13px}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--leaf);color:var(--on-leaf);font-weight:700;padding:11px 16px;border-radius:14px;min-height:44px;text-align:center}
.btn svg{width:18px;height:18px;flex:none}
.btn.ghost{background:var(--surface);color:var(--leaf-ink);border:1px solid var(--line)}
.btn.soft{background:var(--leaf-soft);color:var(--leaf-ink)}
.btn.water{background:var(--water);color:#fff}
.btn.sm{min-height:34px;padding:6px 12px;border-radius:11px;font-size:13px}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>.btn{flex:1}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;text-align:center;padding:7px 6px;border-radius:9px;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.thriving{background:var(--leaf-soft);color:var(--leaf-ink)}
.pill.okay{background:var(--surface-2);color:var(--ink-2)}
.pill.thirsty{background:var(--water-soft);color:var(--water-ink)}
.pill.wilting{background:var(--sun-soft);color:var(--sun-ink)}
.pill.sick{background:var(--alert-soft);color:var(--alert-ink)}
.pill.plain::before{display:none}
.pts{display:inline-flex;align-items:center;gap:4px;background:var(--sun-soft);color:var(--sun-ink);font-weight:700;font-size:13px;padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pts::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--sun)}

/* Cards and lists */
.card{background:var(--surface);border-radius:var(--r);padding:14px;border:1px solid var(--line)}
.list{background:var(--surface);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600}
.chev{color:var(--ink-2);width:16px;height:16px;flex:none}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--leaf-soft);color:var(--leaf-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.avatar.me{background:var(--ink);color:var(--bg)}
.avatar.lg{width:72px;height:72px;font:800 26px var(--display)}

/* Buddies */
.hero{margin:0 16px;border-radius:26px;padding:16px;display:grid;grid-template-columns:132px 1fr;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.hero.wilting{background:var(--sun-soft);border-color:transparent}
.hero.sick{background:var(--alert-soft);border-color:transparent}
.hero.thirsty{background:var(--water-soft);border-color:transparent}
.hero.thriving,.hero.okay{background:var(--leaf-soft);border-color:transparent}
.hero h2{font-size:24px;font-weight:800;line-height:1.1}
.bubble{position:relative;background:var(--surface);border-radius:16px;padding:10px 12px;font-size:15px;font-weight:500;line-height:1.3;margin:8px 0 10px}
.bubble::before{content:"";position:absolute;left:-7px;top:18px;width:14px;height:14px;background:var(--surface);transform:rotate(45deg);border-radius:3px}
.bubble.down::before{left:50%;top:auto;bottom:-6px;margin-left:-7px}
.plant{overflow:visible}
.plant .sway{transform-origin:60px 82px;animation:breathe 4.5s ease-in-out infinite alternate}
@keyframes breathe{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:12px 12px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%}
.bcard .plant{align-self:center}
.bcard .n{font:700 18px var(--display)}
.sumrow{display:flex;gap:8px;padding:14px 16px 10px;flex-wrap:wrap}

/* Plant detail */
.phead{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 20px 4px;gap:4px}
.phead h1{font-size:30px;font-weight:800;display:flex;align-items:center;gap:8px}
.phead .edit{width:30px;height:30px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2)}
.phead .edit svg{width:15px;height:15px}
.phead .bubble{max-width:290px;margin:4px 0 2px}
.meter{display:grid;grid-template-columns:28px 1fr;gap:4px 10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.meter:first-child{border-top:0}
.meter .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center}
.meter .ic svg{width:16px;height:16px}
.meter .top{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.meter .top span:last-child{color:var(--ink-2);font-weight:500;font-size:13px;text-align:right}
.bar{grid-column:2;height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.step{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px 14px;border-top:1px solid var(--line);width:100%;align-items:start}
.step:first-child{border-top:0}
.step .num{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--ink-2)}
.step.done .num{background:var(--leaf);border-color:var(--leaf);color:var(--on-leaf)}
.step.done .num svg{width:14px;height:14px}
.step .t{font-weight:600}
.step.done .t{text-decoration:line-through;color:var(--ink-2)}

/* Forum and community */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px}
.search svg{width:18px;height:18px;color:var(--ink-2);flex:none}
.search input{flex:1;border:0;background:none;outline:0;min-width:0;height:100%}
.qrow{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:12px 14px;border-top:1px solid var(--line);width:100%;align-items:start}
.qrow:first-child{border-top:0}
.votebox{display:flex;flex-direction:column;align-items:center;border-radius:11px;background:var(--surface-2);padding:5px 0;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-2);width:44px}
.votebox svg{width:16px;height:16px}
.votebox.on{background:var(--leaf-soft);color:var(--leaf-ink)}
.vote{display:flex;flex-direction:column;align-items:center;gap:1px;width:44px;flex:none;font-weight:700;font-variant-numeric:tabular-nums}
.vote button{width:36px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);background:var(--surface-2)}
.vote button svg{width:16px;height:16px}
.vote button.up.on{background:var(--leaf);color:var(--on-leaf)}
.vote button.dn.on{background:var(--alert);color:#fff}
.post{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line)}
.post:first-child{border-top:0}
.post h3{font-size:17px;font-weight:700;line-height:1.2;margin:4px 0}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--leaf-ink)}
.tag.q{color:var(--water-ink)} .tag.show{color:var(--sun-ink)}
.meta{font-size:13px;color:var(--ink-2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lvl{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.answer{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line)}
.answer:first-child{border-top:0}
.answer.mine{background:var(--leaf-soft)}
textarea,input[type=text],input[type=number],input[type=date],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px}
textarea{min-height:88px;resize:vertical}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>span{font-size:13px;font-weight:600;color:var(--ink-2)}
.form{display:flex;flex-direction:column;gap:14px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;background:var(--surface-2);font-size:22px;font-weight:600;text-align:center}
.stepper output{flex:1;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.rank{width:22px;text-align:center;font:700 17px var(--display);color:var(--ink-2);font-variant-numeric:tabular-nums}
.row.me{background:var(--leaf-soft)}

/* Camera */
.cam{position:absolute;inset:0;background:#000;color:#fff;overflow:hidden}
.scene{position:absolute;inset:0;width:100%;height:100%}
.scene .world{animation:sway 7s ease-in-out infinite alternate}
@keyframes sway{from{transform:translate(-3px,2px)}to{transform:translate(3px,-2px)}}
.scene .ret{animation:lock 1.6s ease-in-out infinite alternate}
@keyframes lock{from{opacity:.75}to{opacity:1}}
.scene .scanline{animation:scan 1.3s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(var(--h))}}
.scene text{font:700 13px var(--body)}
.scene [data-a]{cursor:pointer}
.media{position:absolute;inset:0;background:#000}
.media video,.media img{width:100%;height:100%;object-fit:cover;display:block}
.marks{position:absolute;inset:0}
.cam-tap{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.mark{position:absolute;width:150px;height:170px;transform:translate(-50%,-50%);pointer-events:none;color:#fff}
.mark.sm{width:84px;height:96px}
.mark.on{color:#F2B01E}
.mark.busy{background:rgba(76,194,127,.16)}
.mark svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7));animation:lock 1.6s ease-in-out infinite alternate}
.mk-label{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-6px);background:rgba(0,0,0,.62);color:#fff;font:700 13px var(--body);padding:4px 11px;border-radius:999px;white-space:nowrap;pointer-events:auto;display:inline-flex;gap:6px;align-items:center}
.mark.sm .mk-label{font-size:11px;padding:3px 8px}
.mark.on .mk-label{background:#F2B01E;color:#2B1C00}
.mk-label i{width:8px;height:8px;border-radius:50%}
.mk-conf{opacity:.8;font-variant-numeric:tabular-nums}
.mk-scan{position:absolute;left:0;right:0;top:0;height:4px;border-radius:2px;background:#7CF2AE;box-shadow:0 0 12px #7CF2AE;animation:mkscan 1.3s ease-in-out infinite alternate}
@keyframes mkscan{to{top:calc(100% - 4px)}}
.wsweep{position:absolute;left:0;right:0;top:0;height:3px;background:#7CF2AE;box-shadow:0 0 14px #7CF2AE;animation:wsweep 1.8s linear infinite alternate}
@keyframes wsweep{to{top:calc(100% - 3px)}}
.filepick{position:relative}
.filepick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.cam-top{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}
.cam-chip{background:rgba(0,0,0,.55);color:#fff;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;display:inline-flex;gap:7px;align-items:center}
.cam-chip i{width:8px;height:8px;border-radius:50%;background:#A9B4AD}
.cam-chip i.rec{background:#FF5A4F}
.cam-chip svg{width:14px;height:14px}
.cam-roll .thumb img,.photo img{width:100%;height:100%;object-fit:cover;display:block}
.cam-roll{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.55);padding:4px 12px 4px 4px;border-radius:999px;font-size:13px;font-weight:700;color:#fff}
.cam-roll .thumb{width:32px;height:32px;border-radius:50%;overflow:hidden;position:relative}
.cam-pop{position:absolute;top:58px;left:12px;right:12px;background:var(--surface);color:var(--ink);border-radius:20px;padding:12px;display:grid;grid-template-columns:64px 1fr;gap:10px;box-shadow:0 12px 30px rgba(0,0,0,.35);animation:pop .2s ease-out}
@keyframes pop{from{transform:translateY(-8px) scale(.97)}to{transform:none}}
.cam-pop h3{font-size:20px;font-weight:800;line-height:1.1}
.cam-pop .facts{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}
.cam-pop .x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.cam-pop .x svg{width:14px;height:14px}
.fact{font-size:11px;font-weight:600;background:var(--surface-2);border-radius:8px;padding:3px 7px;color:var(--ink-2)}
.cam-bottom{position:absolute;left:0;right:0;bottom:0;padding:26px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;background:linear-gradient(transparent,rgba(0,0,0,.75) 45%)}
.cam-hint{font-size:13px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.6);text-align:center}
.cam-bottom .seg{background:rgba(255,255,255,.18);width:100%;max-width:300px}
.cam-bottom .seg button{color:#fff}
.cam-bottom .seg button.on{background:#fff;color:#111}
.shutter{width:66px;height:66px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.4);background-clip:padding-box}
.shutter:active{transform:scale(.94)}
.shutter{display:grid;place-items:center;color:#1B7A46}
.shutter svg{width:28px;height:28px}
.shutter[data-mode="diagnose"]{color:#C2402F}
.shutter[disabled]{opacity:.55;cursor:default}
.aim{position:absolute;left:50%;top:50%;width:84px;height:84px;transform:translate(-50%,-50%);pointer-events:none;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.aim svg{width:100%;height:100%}
.scene .hint{animation:hintp 1.8s ease-in-out infinite alternate}
@keyframes hintp{from{opacity:.45}to{opacity:.95}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .35s ease-out}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo{aspect-ratio:1;border-radius:14px;overflow:hidden;position:relative;background:#000}
.photo span{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 5px;font-size:11px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.7))}

/* Gardens and map */
.gcard{display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px}
.gcard h3{font-size:20px;font-weight:700;line-height:1.15}
.gcard .mini{display:flex;align-items:flex-end;margin:8px 0 2px;gap:0}
.gcard .mini .plant{margin-right:-8px}
.gtop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .dot{width:10px;height:10px;border-radius:50%;flex:none}
.logrow{display:grid;grid-template-columns:36px 1fr;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.logrow:first-child{border-top:0}
.logrow .ic{width:36px;height:36px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.logrow .ic svg{width:18px;height:18px}
.logrow .ic.w{background:var(--water-soft);color:var(--water-ink)}
.logrow .next{color:var(--leaf-ink);font-weight:600;font-size:13px}
.map{border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)}
.map svg{width:100%;height:auto}
.m-land{fill:var(--surface-2)} .m-road{stroke:var(--surface);fill:none;stroke-linecap:round}
.m-river{stroke:var(--water-soft);fill:none;stroke-linecap:round} .m-park{fill:var(--leaf-soft)}
.m-label{fill:var(--ink-2);font:600 10px var(--body)}
.m-pin{cursor:pointer}
.m-pulse{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{from{transform:scale(.6);opacity:.7}to{transform:scale(2.1);opacity:0}}
.acard{border-left:5px solid var(--alert)}
.acard.med{border-left-color:var(--sun)}
.acard h3{font-size:17px;font-weight:700;line-height:1.2}
.banner{background:var(--sun-soft);color:var(--sun-ink);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:600}

/* Profile */
.prof{display:flex;gap:14px;align-items:center;padding:6px 20px 0}
.prof h1{font-size:26px;font-weight:800;line-height:1.1}
.levelcard{background:var(--ink);color:var(--bg);border-radius:24px;padding:16px;margin:16px 16px 0}
.levelcard .big{font:800 34px/1 var(--display);font-variant-numeric:tabular-nums}
.levelcard .bar{background:rgba(127,127,127,.35);height:9px;margin:10px 0 6px}
.levelcard .bar i{background:var(--sun)}
.levelcard .lv{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.levelcard .name{font:700 20px var(--display)}
.levelcard small{opacity:.75;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.stat b{display:block;font:800 22px var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--ink-2);font-weight:600}
.reward{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.reward:first-child{border-top:0}
.code{font:700 22px ui-monospace,Menlo,monospace;letter-spacing:.08em;background:var(--surface-2);border-radius:12px;padding:14px;text-align:center}

/* Soil test */
.sbar{position:relative;height:10px;border-radius:5px;background:var(--surface-2);grid-column:1/-1;margin:4px 0 2px}
.sbar .band{position:absolute;top:0;bottom:0;border-radius:5px;background:var(--leaf);opacity:.3}
.sbar .dot{position:absolute;top:-4px;width:18px;height:18px;margin-left:-9px;border-radius:50%;border:3px solid var(--surface);background:var(--ink)}
.srow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow b{font:800 20px var(--display);font-variant-numeric:tabular-nums}
.soil-art{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.soil-art svg{width:100%;height:auto}
.soil-art text{font:600 10px var(--body);fill:var(--ink-2)}
.labnum{width:26px;height:26px;border-radius:50%;background:var(--water);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.note{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--leaf);border-radius:14px;padding:12px 14px}
.dots3::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots3 1.2s steps(4,end) infinite}
@keyframes dots3{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Initiatives */
.ibar{position:relative;height:12px;border-radius:6px;background:var(--surface-2);margin:10px 0 6px}
.ibar>i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--leaf);transition:width .5s ease}
.ibar.done>i{background:var(--sun)}
.ibar .ms{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--surface);border:3px solid var(--line)}
.ibar .ms.on{border-color:var(--surface);background:var(--sun)}
.ibar.sm{height:7px;margin:2px 0 0}
.icard{display:block;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px}
.icard h3{font-size:19px;font-weight:700;line-height:1.15}
.inum{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.inum b{font:800 22px var(--display)}
.ihero .inum b{font-size:32px}
.optrow{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border-top:1px solid var(--line)}
.optrow:first-child{border-top:0}
.optrow .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.optrow.on{background:var(--leaf-soft)}
.optrow.on .radio{border-color:var(--leaf)}
.optrow.on .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--leaf)}
.optrow[disabled]{opacity:.45;cursor:default}
.erow{display:grid;grid-template-columns:1fr 76px 36px;gap:8px;align-items:center}
.erow.two{grid-template-columns:1fr 1fr 36px}
.erow.one{grid-template-columns:1fr 36px}
.erow.rw{grid-template-columns:96px 1fr 36px}
.xbtn{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.xbtn svg{width:14px;height:14px}
.xbtn[disabled]{opacity:.35;cursor:default}
.fsec{display:flex;flex-direction:column;gap:8px}
.fsec>h3{font-size:17px;font-weight:700;display:flex;gap:8px;align-items:baseline}
.fsec>h3 small{font:500 13px var(--body);color:var(--ink-2)}
.total{display:flex;justify-content:space-between;align-items:center;background:var(--leaf-soft);color:var(--leaf-ink);border-radius:12px;padding:10px 12px;font-weight:700;font-variant-numeric:tabular-nums}
.ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--leaf-soft);color:var(--leaf-ink)}
.ico svg{width:17px;height:17px}
.ico.w{background:var(--water-soft);color:var(--water-ink)}
.ico.s{background:var(--sun-soft);color:var(--sun-ink)}
.ico.off{background:var(--surface-2);color:var(--ink-2)}

/* Sheets and toasts */
#sheet-root{position:absolute;inset:0;pointer-events:none;z-index:10}
#sheet-root>*{pointer-events:auto}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.backdrop.in{animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;background:var(--bg);border-radius:26px 26px 0 0;display:flex;flex-direction:column}
.sheet.full{height:94%}
.sheet.in{animation:rise .26s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(60%)}to{transform:none}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 8px;gap:10px;flex:none}
.sheet-head h2{font-size:22px;font-weight:800;line-height:1.1}
.sheet-head button{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);flex:none}
.sheet-head button svg{width:15px;height:15px}
.sheet-body{overflow-y:auto;padding:4px 16px 22px;display:flex;flex-direction:column;gap:14px}
.dx-top{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center}
.dx-scan{position:relative;display:grid;place-items:center;padding:20px 0}
.dx-scan::after{content:"";position:absolute;left:25%;right:25%;top:12%;height:3px;background:var(--leaf);border-radius:2px;box-shadow:0 0 14px var(--leaf);animation:dxscan 1s ease-in-out infinite alternate}
@keyframes dxscan{to{top:82%}}
.fix{counter-reset:f;display:flex;flex-direction:column;gap:8px;padding:0;list-style:none}
.fix li{counter-increment:f;display:grid;grid-template-columns:24px 1fr;gap:8px}
.fix li::before{content:counter(f);width:22px;height:22px;border-radius:50%;background:var(--surface-2);font-weight:700;font-size:13px;display:grid;place-items:center}
.prod{padding:12px 14px;border-top:1px solid var(--line)}
.prod:first-child{border-top:0}
.prod .stores{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.wsteps{display:flex;gap:6px}
.wsteps i{flex:1;height:4px;border-radius:2px;background:var(--surface-2)}
.wsteps i.on{background:var(--leaf)}
.wscan{position:relative;height:390px;border-radius:20px;overflow:hidden;background:#000}
.wscan .count{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-weight:700;padding:6px 12px;border-radius:999px;font-size:13px}
#toast-root{position:absolute;top:50px;left:12px;right:12px;display:flex;flex-direction:column;gap:6px;align-items:center;z-index:20;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-weight:600;font-size:13px;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:drop .25s ease-out;max-width:100%;text-align:center}
.toast.pts{background:var(--sun);color:#3A2500}
.toast.lvl{background:var(--leaf);color:var(--on-leaf)}
.toast.out{opacity:0;transition:opacity .3s}
@keyframes drop{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:480px){#toast-root{top:10px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

const soilName = k => k === 'ph' ? 'pH' : SOIL_REF[k].label.toLowerCase();
function soilStatus(key, v){ const r = SOIL_REF[key]; return v < r.lo ? 'Low' : v > r.hi ? 'High' : 'Good'; }
// Rule-based stand-in for the AI analysis: reads the numbers and returns findings and actions.
function soilAnalyse(v, p){
  const out = [], st = k => soilStatus(k, v[k]);
  if (st('ph') === 'High') out.push([`pH is ${v.ph}, above the 6.0 to 7.0 most vegetables and herbs prefer. Iron and phosphorus get harder for roots to take up.`, 'Work in elemental sulphur or pine-bark compost this season and stop adding lime or wood ash. Retest in three months.']);
  if (st('ph') === 'Low') out.push([`pH is ${v.ph}, more acidic than the 6.0 to 7.0 most vegetables and herbs prefer.`, 'Add garden lime in small amounts and retest in three months.']);
  if (st('n') === 'Low') out.push([`Nitrogen is low at ${v.n} ppm. Expect pale lower leaves and slow growth.`, 'Side-dress with composted manure or blood meal now, and sow a legume cover crop when the bed is empty.']);
  if (st('n') === 'High') out.push([`Nitrogen is high at ${v.n} ppm. Plants will make leaves at the expense of fruit.`, 'Pause nitrogen feeds until the next test.']);
  if (st('p') === 'High') out.push([`Phosphorus is high at ${v.p} ppm, usually from years of compost or bloom fertilizer.`, 'Skip bone meal and bloom feeds. Choose a fertilizer with a low middle number.']);
  if (st('p') === 'Low') out.push([`Phosphorus is low at ${v.p} ppm. Roots and flowers will be weak.`, 'Mix in bone meal or rock phosphate before the next planting.']);
  if (st('k') === 'Low') out.push([`Potassium is low at ${v.k} ppm. Fruit quality and disease resistance suffer.`, 'Add sulphate of potash or kelp meal.']);
  if (st('k') === 'High') out.push([`Potassium is high at ${v.k} ppm.`, 'Leave out potash and wood ash this year.']);
  if (st('om') === 'Low') out.push([`Organic matter is ${v.om}%, on the thin side for a vegetable bed. The soil will dry out fast.`, 'Spread 3 to 5 cm of finished compost each spring and keep the bed mulched.']);
  if (st('pb') === 'High') out.push([`Lead is ${v.pb} ppm, above this lab's garden guideline.`, 'Grow food in raised beds filled with clean soil, keep bare soil covered, wash hands and produce, and get an agronomist to review the report.']);
  const good = Object.keys(SOIL_REF).filter(k => st(k) === 'Good').map(soilName);
  const head = out.length ? `${out.length === 1 ? 'One thing' : out.length + ' things'} to fix for ${p.name}. Start with the first.` : `Nothing to fix. This soil suits ${p.name} well.`;
  return {head, items:out, good};
}

const video = document.createElement('video');
video.muted = true; video.autoplay = true; video.setAttribute('playsinline', ''); video.setAttribute('aria-label', 'Live camera view');
let stream = null, starting = false;
const camPref = v => { try { if (v === undefined) return localStorage.getItem('os-cam') === 'live'; localStorage.setItem('os-cam', v ? 'live' : 'sample'); } catch (e) {} return false; };
function stopLive(){ if (stream){ stream.getTracks().forEach(t => t.stop()); stream = null; video.srcObject = null; } }
async function startLive(){
  starting = true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}, audio:false});
    video.srcObject = stream; starting = false;
    if (!document.querySelector('[data-media]')) return stopLive();
    video.play().catch(() => {}); recKick();
  } catch (e) {
    starting = false; stream = null; S.cam.src = 'sample'; S.cam.blocked = true; S.cam.marks = []; camPref(false);
    if (S.sheet?.type === 'setup'){ toast('Live camera is blocked on this page. Using the sample garden.'); renderSheet(); }
    else { render(); if (S.tab === 'scan') openSheet('camsrc'); }
  }
}
function syncCamera(){
  const slot = document.querySelector('#sheet-root [data-media]') || document.querySelector('#screen [data-media]');
  if (!slot) return stopLive();
  if (video.parentNode !== slot) slot.appendChild(video);
  if (stream) video.play().catch(() => {}); else if (!starting) startLive();
  if (S.tab === 'scan' && S.cam.src === 'live'){ if (S.rec.status === 'off' && S.rec.url) recLoad(S.rec.url).then(recKick); else recKick(); }
}

let recModel = null, recLoop = false;
const recCanvas = document.createElement('canvas'); recCanvas.width = recCanvas.height = 224;
const recPool = () => S.plants.filter(p => !p.unnamed && (p.mine || p.where === 'g1'));
const recSave = () => { try { localStorage.setItem('os-rec', JSON.stringify({url:S.rec.url, map:S.rec.map})); } catch (e) {} };
const addScript = src => new Promise((ok, no) => { const el = document.createElement('script'); el.src = src; el.onload = ok; el.onerror = () => { el.remove(); no(); }; document.head.appendChild(el); });
async function recLibs(){
  for (const [name, urls] of REC_LIBS){
    if (window[name]) continue;
    let ok = false;
    for (const u of urls){ try { await addScript(u); ok = true; break; } catch (e) {} }
    if (!ok) throw new Error('Could not load the recognition library. It needs an internet connection and does not load inside the Claude viewer.');
  }
}
async function recLoad(url){
  url = url.trim().replace(/(model|metadata)\.json$/, ''); if (!url) return;
  if (!url.endsWith('/')) url += '/';
  const R = S.rec; R.url = url; R.status = 'loading'; R.err = ''; recModel = null;
  if (S.sheet?.type === 'camsrc') renderSheet();
  try {
    await recLibs();
    recModel = await window.tmImage.load(url + 'model.json', url + 'metadata.json');
    R.labels = recModel.getClassLabels();
    R.labels.forEach(l => { if (!(l in R.map)){ const m = recPool().find(p => p.name.toLowerCase() === String(l).toLowerCase()); R.map[l] = m ? m.id : ''; } });
    R.status = 'ready'; recSave();
  } catch (e) { R.status = 'error'; R.err = String(e?.message || e).slice(0, 180); recModel = null; }
  if (S.sheet?.type === 'camsrc') renderSheet(); else if (S.tab === 'scan' && !S.sheet) render();
}
function recReset(){ const R = S.rec; if (R.locked){ S.cam.marks = []; S.scan.sel = null; } R.locked = R.cand = R.dismissed = null; R.streak = R.misses = 0; }
function recKick(){ if (!recLoop && S.rec.status === 'ready'){ recLoop = true; setTimeout(recTick, 100); } }
async function recTick(){
  if (!(S.rec.status === 'ready' && recModel && stream && S.tab === 'scan' && !cur() && S.cam.src === 'live')){ recLoop = false; recReset(); return; }
  if (!S.sheet && !S.scan.busy && S.scan.mode !== 'photo' && video.videoWidth){
    const side = Math.min(video.videoWidth, video.videoHeight);
    try {
      recCanvas.getContext('2d').drawImage(video, (video.videoWidth - side) / 2, (video.videoHeight - side) / 2, side, side, 0, 0, 224, 224);
      recUpdate(await recModel.predict(recCanvas));
    } catch (e) {}
  }
  setTimeout(recTick, REC_EVERY);
}
function recUpdate(preds){
  const R = S.rec, best = preds.reduce((a, b) => b.probability > a.probability ? b : a), id = R.map[best.className];
  const hit = id && plant(id) && best.probability >= REC_MIN ? id : null;
  if (hit && hit === R.cand) R.streak++; else { R.cand = hit; R.streak = hit ? 1 : 0; }
  R.misses = hit === R.locked && hit ? 0 : R.misses + 1;
  if (hit && R.streak >= REC_STREAK && R.locked !== hit){
    R.locked = hit; R.misses = 0; R.dismissed = null; S.cam.marks = [{x:50, y:54, id:hit, conf:best.probability}];
    S.scan.sel = S.scan.mode === 'identify' ? hit : null; render();
  } else if (R.locked && R.misses >= REC_MISSES){
    recReset(); S.cam.marks = []; S.scan.sel = null; render();
  } else if (R.locked && hit === R.locked){
    const el = document.querySelector('.mk-conf'); if (el) el.textContent = Math.round(best.probability * 100) + '%';
  }
}

function soilResults(id, vals, source){

const niTotal = () => S.sheet.items.reduce((a, x) => a + Math.max(0, parseInt(x.need) || 0), 0);
function iApply(i, idx, qty, handle){
  const it = i.items[idx], before = iPct(i);
  qty = Math.max(0, Math.min(qty, it.need - it.got)); if (!qty) return [];
  it.got += qty; i.recent.unshift([handle, `${qty} ${it.name}`, 'Just now']);
  const after = iPct(i);
  return iGoals(i).filter(g => g > before && g <= after + 1e-9);
}
function iCelebrate(i, goals, owner){
  goals.forEach((g, k) => setTimeout(() => {
    const r = i.rewards.find(x => +x.pct === g);
    earn(g === 100 ? 50 : 25, owner ? (g === 100 ? 'Your initiative reached its goal' : `Your initiative reached ${g}%`) : (g === 100 ? 'You helped reach the final goal' : `You helped reach the ${g}% goal`));
    if (r) setTimeout(() => toast(`Reward unlocked: ${r.text}`, 'lvl'), 900);
    if (!S.sheet) render();
  }, 1100 + k * 2200));
}
function iNeighbour(id){
  const i = S.inits.find(x => x.id === id); if (!i) return;
  const idx = i.items.findIndex(x => x.got < x.need); if (idx < 0) return;
  const it = i.items[idx], qty = Math.max(1, Math.ceil(iNeed(i) * .3));
  const goals = iApply(i, idx, qty, 'priya_plants'); i.supporters++;
  toast(`@priya_plants pledged ${it.got > 0 ? i.recent[0][1] : qty + ' ' + it.name} to your initiative`);
  if (!S.sheet) render();
  iCelebrate(i, goals, true);
}

function gardenTasks(g){

function dxSheet(sh){
  const p = plant(sh.a), name = p.unnamed ? 'This ' + CARE[p.kind].species.toLowerCase() : p.name;
  if (sh.scanning) return ['Scanning ' + name, `<div class="dx-scan">${plantSVG(p, 150)}</div><p class="sub" style="text-align:center">Checking leaves, stems and soil for 40 common problems…</p>`];
  const key = issueOf(p);
  if (!key) return ['No problems found', `<div class="dx-top">${plantSVG(p, 84)}<div><p style="font-weight:600;font-size:17px">${esc(name)} looks healthy.</p><p class="sub">Leaves, stems and soil all check out. Scan again if anything changes.</p></div></div><button class="btn block" data-a="close">Done</button>`];
  const d = ISSUES[key];
  return [d.name, `<div class="dx-top">${plantSVG(p, 84)}<div><p class="sub">Found on ${esc(name)}</p><div class="chips" style="margin:6px 0"><span class="pill sick plain">${d.sev}</span><span class="pill okay plain">${d.conf}% match</span></div><div class="bar"><i style="width:${d.conf}%;background:var(--alert)"></i></div></div></div>
    <p>${d.what}</p>
    <div><h3 style="font-size:17px;margin-bottom:8px">What to do</h3><ol class="fix">${d.fix.map(f => `<li><span>${f}</span></li>`).join('')}</ol></div>
    <div><h3 style="font-size:17px;margin-bottom:8px">Products that help</h3><div class="list">${d.products.map((pr, i) => `<div class="prod"><p style="font-weight:600">${pr[0]}</p><div class="stores">${pr[1].map((s, j) => `<button class="btn ghost sm" data-a="store:${key}:${i}:${j}">${esc(s[0])} · ${s[1]}</button>`).join('')}</div></div>`).join('')}</div>
      <p class="sub" style="margin-top:8px">Affiliate links. Open Sprouts earns a small commission when you buy. Prices are samples.</p></div>
    ${key === 'dry' ? `<button class="btn water block" data-a="water:${p.id}">${I.drop}Water ${esc(name)} now</button>` : `<button class="btn block" data-a="treated:${p.id}">Mark as treated<span class="pts" style="margin-left:6px">+15</span></button>`}`];
}
function setupSheet(sh){
  const dots = `<div class="wsteps">${[0,1,2,3].map(i => `<i class="${i <= sh.step ? 'on' : ''}"></i>`).join('')}</div>`;
  if (sh.step === 0) return ['Set up a garden', dots + `<p class="sub">You scan the beds once. Open Sprouts builds the plant list and care schedule, so volunteers do not have to ask you what needs doing.</p>
    <label class="fld"><span>Garden name</span><input id="setup-name" type="text" data-bind="sheet.name" value="${esc(sh.name)}" maxlength="40" placeholder="Garden name"></label>
    <button class="btn block" data-a="setupNext">Next: scan the beds</button>`];
  if (sh.step === 1){
    const done = sh.found >= SCENE.length, live = S.cam.src === 'live';
    const view = live ? `<div class="media" data-media></div>${sh.scanning ? '<span class="wsweep"></span>' : ''}${WPOS.slice(0, Math.min(sh.found, SCENE.length)).map((q, i) => `<div class="mark sm" style="left:${q[0]}%;top:${q[1]}%">${BRACKET}<span class="mk-label">${CARE[sh.plants[i].kind].species}</span></div>`).join('')}` : sceneSVG({overlay:true, found:sh.found, tap:false, generic:true});
    return ['Scan the beds', dots + `<div class="wscan">${view}<span class="count">${sh.scanning ? 'Scanning… ' : ''}${plural(Math.min(sh.found, SCENE.length), 'plant')} found</span></div>
      <p class="sub">${done ? 'All beds scanned. Next, check what the scan found and correct anything it got wrong.' : 'Walk slowly along each bed with the camera pointed at the plants. ' + (live ? 'The plants it finds are sample data.' : 'This view is a sample garden.')}</p>
      ${!live && !done && !sh.scanning && !S.cam.blocked ? '<button class="btn ghost block" data-a="wizLive">Use the live camera instead</button>' : ''}
      ${done ? '<button class="btn block" data-a="setupNext">Next: review plants</button>' : `<button class="btn block" data-a="setupScan" ${sh.scanning ? 'disabled' : ''}>${I.scanIc}${sh.scanning ? 'Scanning…' : 'Start AR scan'}</button>`}`];
  }
  if (sh.step === 2) return ['Review plants', dots + `<p class="sub">Tap a plant to edit its name, water schedule, sunlight, fertilizer and soil.</p>
    <div class="stack">${sh.plants.map((o, i) => sh.open === i
      ? `<div class="card form"><div style="display:flex;gap:10px;align-items:center">${plantSVG(o, 48, 'okay')}<div><p style="font-weight:700">${CARE[o.kind].species}</p><p class="sub">Detected by scan</p></div></div>${editor('setup.' + i, o)}</div>`
      : `<button class="card" data-a="setupOpen:${i}" style="display:flex;gap:10px;align-items:center;width:100%">${plantSVG(o, 40, 'okay')}<span class="grow" style="flex:1"><b>${esc(o.name)}</b><br><span class="sub">Every ${plural(o.every, 'day')} · ${esc(o.sun)} · ${esc(o.fert)}</span></span>${I.chev}</button>`).join('')}</div>
    <button class="btn block" data-a="setupNext">Looks right. Create garden</button>`];
  return ['Garden ready', dots + `<div style="display:flex;justify-content:center">${sh.plants.slice(0, 5).map(o => plantSVG(o, 56, 'thriving')).join('')}</div>
    <p style="font-weight:600;font-size:17px;text-align:center">${esc(sh.name || 'Your garden')} has ${plural(sh.plants.length, 'plant')} and a care schedule.</p>
    <div class="code">${sh.code}</div><p class="sub" style="text-align:center">Share this code with volunteers. They will see what has been done and what needs doing.</p>
    <button class="btn block" data-a="setupDone">Open garden</button>`];
}

/* ---------- rendering ---------- */
const TABS = [['buddies','Buddies',I.tBuddies],['gardens','Gardens',I.tGardens],['scan','Scan',I.scanIc],['community','Community',I.tCommunity],['profile','Profile',I.tProfile]];
const scrollMem = {}; let lastKey = '';
const viewKey = () => { const t = cur(); return S.tab + (t ? `/${t.v}/${t.id}/${t.x || ''}` : ''); };
function viewHTML(){
  const t = cur();
  if (t) switch (t.v){ case 'plant': return vPlant(t.id); case 'q': return vQuestion(t); case 'garden': return vGarden(t.id); case 'post': return vPost(t.id); case 'soil': return vSoil(t.id); case 'init': return vInit(t.id); }
  return {buddies:vBuddies, gardens:vGardens, scan:vScan, community:vCommunity, profile:vProfile}[S.tab]();
}
function render(enter){
  const scr = $('#screen'), key = viewKey(), cam = S.tab === 'scan' && !cur();
  if (lastKey) scrollMem[lastKey] = scr.scrollTop;
  scr.className = 'screen' + (cam ? ' is-cam' : '') + (enter ? ' enter' : '');
  scr.innerHTML = viewHTML();
  scr.scrollTop = scrollMem[key] || 0;
  lastKey = key;
  $('#phone').classList.toggle('cammode', cam);
  $('#tabbar').innerHTML = TABS.map(t => `<button class="${t[0] === 'scan' ? 'scan ' : ''}${S.tab === t[0] ? 'on' : ''}" data-a="tab:${t[0]}" ${S.tab === t[0] ? 'aria-current="page"' : ''}>${t[0] === 'scan' ? `<span class="ring">${t[2]}</span>` : t[2]}${t[1]}</button>`).join('');
  renderSheet();
}
function renderSheet(){
  const r = $('#sheet-root');
  if (!S.sheet){ r.innerHTML = ''; return syncCamera(); }
  const fresh = S.sheet.fresh; S.sheet.fresh = false;
  const sc = r.querySelector('.sheet-body')?.scrollTop || 0;
  const [title, body] = sheetHTML();
  r.innerHTML = `<div class="backdrop ${fresh ? 'in' : ''}" data-a="close"></div><div class="sheet ${fresh ? 'in' : ''} ${S.sheet.type === 'setup' ? 'full' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><div class="sheet-head"><h2>${esc(title)}</h2><button data-a="close" aria-label="Close">${I.x}</button></div><div class="sheet-body">${body}</div></div>`;
  if (!fresh) r.querySelector('.sheet-body').scrollTop = sc;
  syncCamera();
}
function toast(msg, kind = ''){
  const el = document.createElement('div'); el.className = 'toast ' + kind; el.textContent = msg;
  const root = $('#toast-root'); while (root.children.length > 1) root.firstChild.remove();
  root.appendChild(el);
  setTimeout(() => el.classList.add('out'), 2400); setTimeout(() => el.remove(), 2800);
}
function earn(n, why){
  const before = level(S.user.xp).i;
  S.user.pts += n; S.user.xp += n; S.user.history.unshift({n, why, when:'Just now'});
  toast(`+${n} points · ${why}`, 'pts');
  if (level(S.user.xp).i > before) setTimeout(() => toast(`Level up. You are now a ${level(S.user.xp).name}.`, 'lvl'), 800);
}
function openSheet(type, a, extra = {}){ S.sheet = {type, a, fresh:true, ...extra}; renderSheet(); }
function resolve(path){
  const parts = path.split('.');
  if (parts[0] === 'sheet'){ let o = S.sheet; parts.slice(1, -1).forEach(k => o = o[k]); return [o, parts[parts.length - 1]]; }
  if (parts[0] === 'setup') return [S.sheet.plants[+parts[1]], parts[2]];
  return [plant(parts[0].slice(2)), parts[1]];
}

/* ---------- actions ---------- */
const A = {
  tab(t){ if (S.tab === t) S.nav[t] = []; S.tab = t; S.sheet = null; S.scan.sel = null; if (t === 'scan') enterScan(); render(); },
  go(t, seg){ S.tab = t; S.nav[t] = []; S.sheet = null; if (t === 'gardens' && seg) S.seg.gardens = seg; if (t === 'scan'){ S.scan.mode = seg || 'identify'; S.scan.sel = null; enterScan(); } render(); },
  push(v, id, x){ if (v === 'plant'){ S.seg.plant = 'care'; S.forumQ = ''; } S.nav[S.tab].push({v, id, x}); delete scrollMem[viewKey()]; render(true); },
  back(){ S.nav[S.tab].pop(); render(); },
  seg(k, v){ S.seg[k] = v; if (k === 'map') S.mapSel = null; render(); },
  close(){ S.sheet = null; render(); },
  sheet(type, a){ openSheet(type, a); },
  water(id){
    const p = plant(id); p.last = 0;
    S.log.unshift({g:p.where, plant:id, action:'Watered', who:'You', days:0, note:''});
    S.user.tasks++; if (S.sheet) S.sheet = null;
    render(); earn(10, `Watered ${p.name}`);
  },
  feed(id){ const p = plant(id); p.fed = 0; S.log.unshift({g:p.where, plant:id, action:'Fertilized', who:'You', days:0, note:''}); S.user.tasks++; render(); earn(10, `Fed ${p.name}`); },
  goSoil(){ S.tab = 'buddies'; S.sheet = null; S.seg.plant = 'care'; S.nav.buddies = [{v:'plant', id:'bob'}, {v:'soil', id:'bob'}]; render(true); },
  soilStep(id, step){ soilOf(id).step = step; delete scrollMem[viewKey()]; render(); $('#screen').scrollTop = 0; },
  soilCheck(id, i){ const so = soilOf(id); so.checks[i] = !so.checks[i]; render(); },
  soilLab(id, lab){ const so = soilOf(id); if (so.status === 'sent') return; so.lab = lab || null; if (so.status === 'ready' && lab) so.status = 'none'; render(); if (lab) $('#screen').scrollTop = 0; },
  soilSend(id){
    const so = soilOf(id), p = plant(id); so.status = 'sent'; render(); toast(`Sample for ${p.name} logged as dropped off`);
    setTimeout(() => { if (so.status === 'sent') soilResults(id, {...SOIL_SAMPLE}, `From ${LABS.find(l => l.id === so.lab).name}, today`); }, 3000);
  },
  soilAI(id){ const so = soilOf(id); so.ai = 'loading'; render(); setTimeout(() => { so.ai = 'done'; const t = cur(); if (t?.v === 'soil' && t.id === id && !S.sheet) render(); }, 1500); },
  soilAgro(id, aid){ const so = soilOf(id); so.agro = aid; so.agroReply = false; render(); toast('Review requested');
    setTimeout(() => { so.agroReply = true; toast(`${AGROS.find(a => a.id === aid).name} replied about ${plant(id).name}`); const t = cur(); if (t?.v === 'soil' && t.id === id && !S.sheet) render(); }, 3500); },
  goInit(){ S.tab = 'community'; S.nav.community = []; S.sheet = null; S.seg.community = 'init'; render(); },
  give(id, k){
    const i = S.inits.find(x => x.id === id), first = i.items.findIndex(x => x.got < x.need);
    const item = k !== undefined && i.items[+k].got < i.items[+k].need ? +k : first; if (item < 0) return;
    openSheet('give', id, {item, qty:1, via: i.drop.length ? '0' : 'ship', note:''});
  },
  giveItem(k){ const sh = S.sheet, it = S.inits.find(x => x.id === sh.a).items[+k]; sh.item = +k; sh.qty = Math.max(1, Math.min(sh.qty, it.need - it.got)); renderSheet(); },
  giveQty(d){ const sh = S.sheet, it = S.inits.find(x => x.id === sh.a).items[sh.item]; sh.qty = Math.max(1, Math.min(it.need - it.got, sh.qty + +d)); renderSheet(); },
  iWay(id, k){
    const w = S.inits.find(x => x.id === id).ways[+k]; w.joined = !w.joined; w.n += w.joined ? 1 : -1; render();
    if (w.joined && !w.earned){ w.earned = true; earn(10, 'Signed up to help'); } else if (w.joined) toast('Signed up');
  },
  newInit(){
    S.sheet = {type:'newinit', fresh:true, title:'', about:'', org:'', unit:'plants', ends:ymd(dAhead(28)), items:[{name:'', need:''}, {name:'', need:''}], drop:[{name:'', detail:''}], ship:'no', address:'', ways:[], rewards:[]};
    renderSheet();
  },
  niAdd(list){
    const sh = S.sheet, blank = {items:{name:'', need:''}, drop:{name:'', detail:''}, ways:{text:''}, rewards:{pct: String([25, 50, 75, 100].find(v => !sh.rewards.some(r => +r.pct === v)) || 100), text:''}}[list];
    sh[list].push(blank); renderSheet();
    const n = sh[list].length - 1; document.getElementById({items:'ni-item-', drop:'ni-drop-', ways:'ni-way-', rewards:'ni-reward-'}[list] + n)?.focus();
  },
  niDel(list, k){ S.sheet[list].splice(+k, 1); renderSheet(); },
  check(id, i){ S.checks[id + i] = !S.checks[id + i]; render(); },
  diagnose(id){ openSheet('dx', id, {scanning:true}); setTimeout(() => { if (S.sheet?.type === 'dx' && S.sheet.a === id){ S.sheet.scanning = false; renderSheet(); } }, 1500); },
  treated(id){ const p = plant(id), n = ISSUES[p.issue].name.toLowerCase(); p.issue = null; S.log.unshift({g:p.where, plant:id, action:'Treated for ' + n, who:'You', days:0, note:''}); S.user.tasks++; S.sheet = null; render(); earn(15, `Treated ${p.name}`); },
  store(key, i, j){ toast(`Demo link. This would open ${ISSUES[key].products[i][1][j][0]} with the Open Sprouts affiliate tag.`); },
  scanMode(m){ S.scan.mode = m; S.scan.sel = null; S.scan.busy = null; S.cam.marks = []; render(); },
  camSrc(src){ S.cam.src = src; S.cam.marks = []; S.cam.tried = true; S.scan.sel = null; S.scan.busy = null; S.sheet = null; camPref(src === 'live'); render(); },
  wizLive(){ S.cam.src = 'live'; S.cam.marks = []; renderSheet(); },
  liveTap(){
    if (S.scan.busy) return;
    if (S.cam.src === 'live' && S.rec.status === 'ready'){
      const id = S.rec.locked;
      if (!id) return toast('No plant recognised yet. Point the camera at one of your plants.');
      if (S.scan.mode === 'diagnose') return A.scanDx(id);
      S.rec.dismissed = null; S.scan.sel = id; return render();
    }
    const r = $('.cam').getBoundingClientRect(), e = lastEvt;
    A.markAt((e.clientX - r.left) / r.width * 100, (e.clientY - r.top) / r.height * 100);
  },
  markAt(px, py){
    const x = Math.max(22, Math.min(78, px)), y = Math.max(42, Math.min(64, py));
    const id = SCENE[S.cam.n++ % SCENE.length].id, m = {x, y, id, pending: S.scan.mode === 'identify'};
    S.cam.marks = [m]; S.scan.sel = null;
    if (S.scan.mode === 'diagnose') return A.scanDx(id);
    render();
    setTimeout(() => { m.pending = false; if (S.tab === 'scan' && S.cam.marks.includes(m)){ S.scan.sel = id; render(); } }, 900);
  },
  scanClose(){ S.scan.sel = null; if (S.rec.locked) S.rec.dismissed = S.rec.locked; render(); },
  recOff(){ S.rec.status = 'off'; S.rec.url = ''; S.rec.labels = []; S.rec.map = {}; recModel = null; recReset(); S.cam.marks = []; recSave(); renderSheet(); },
  scanTap(id){
    if (S.scan.busy) return;
    S.scan.sel = id;
    if (S.scan.mode === 'diagnose') return A.scanDx(id);
    render();
  },
  scanDx(id){
    S.scan.mode = 'diagnose'; S.scan.sel = id; S.scan.busy = id; render();
    setTimeout(() => { if (S.scan.busy !== id) return; S.scan.busy = null; if (S.tab === 'scan' && !cur()){ render(); openSheet('dx', id); } }, 1500);
  },
  shoot(){
    const sc = S.scan, cm = S.cam;
    if (sc.busy) return;
    if (sc.mode === 'photo') return A.snap();
    if (cm.src === 'live' && S.rec.status === 'ready'){
      const id = S.rec.locked;
      if (!id) return toast('No plant recognised yet. Point the camera at one of your plants.');
      if (sc.mode === 'diagnose') return A.scanDx(id);
      S.rec.dismissed = null; sc.sel = id; return render();
    }
    if (cm.src !== 'sample'){
      const m = cm.marks[0];
      if (sc.mode === 'diagnose' && m && !m.pending) return A.scanDx(m.id);
      return A.markAt(50, 52);
    }
    const id = sc.sel || camAim();
    if (sc.mode === 'diagnose') return A.scanDx(id);
    sc.sel = null; sc.busy = id; render();
    setTimeout(() => { if (sc.busy !== id) return; sc.busy = null; if (S.tab === 'scan' && !cur()){ sc.sel = id; render(); } }, 900);
  },
  snap(){
    const f = $('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
    let url = null;
    if (S.cam.src === 'photo') url = S.cam.photo;
    else if (S.cam.src === 'live' && video.videoWidth){
      const c = document.createElement('canvas'); c.width = 480; c.height = Math.round(480 * video.videoHeight / video.videoWidth);
      try { c.getContext('2d').drawImage(video, 0, 0, c.width, c.height); url = c.toDataURL('image/jpeg', .8); } catch (e) {}
    }
    S.photos.unshift({id:Date.now(), label:url ? 'Just now' : 'Bed 1, just now', url});
    const roll = $('.cam-roll'); if (roll){ roll.lastChild.textContent = S.photos.length; roll.querySelector('.thumb').innerHTML = thumbHTML(S.photos[0]); }
    toast('Photo saved to the garden album');
  },
  openPlant(id){ S.tab = 'buddies'; S.nav.buddies = [{v:'plant', id}]; S.seg.plant = 'care'; S.scan.sel = null; render(true); },
  fill(inputId, v){ const el = document.getElementById(inputId); el.value = v; el.focus(); },
  voteQ(kind, qid){ const q = S.forum[kind].find(x => x.id === qid); q.voted = !q.voted; q.votes += q.voted ? 1 : -1; render(); },
  voteA(kind, qid, i){ const a = S.forum[kind].find(x => x.id === qid).answers[+i]; a.voted = !a.voted; a.votes += a.voted ? 1 : -1; render(); },
  voteP(id, d){ const p = S.posts.find(x => x.id === id); d = +d; p.votes -= p.my; p.my = p.my === d ? 0 : d; p.votes += p.my; render(); },
  join(id){ const g = garden(id); g.role = 'volunteer'; g.people.push([S.user.name, 'You']); render(); toast(`You joined ${g.name}`); },
  role(id, r){ garden(id).role = r; render(); },
  taskDone(gid, tid){ const g = garden(gid), t = g.tasks.find(x => x.id === tid); g.tasks = g.tasks.filter(x => x !== t); S.log.unshift({g:gid, plant:null, action:t.text, who:'You', days:0, note:''}); S.user.tasks++; render(); earn(10, 'Garden job done'); },
  mapSel(id){ S.mapSel = S.mapSel === id ? null : id; render(); },
  help(id){ const a = S.alerts.find(x => x.id === id); a.helping = !a.helping; a.helpers += a.helping ? 1 : -1; render(); if (a.helping) earn(20, 'Offered to help a neighbour'); },
  redeem(id){ const r = S.rewards.find(x => x.id === id); if (S.user.pts < r.cost) return; S.user.pts -= r.cost; r.code = 'SPROUT-' + (1000 + Math.floor(Math.random() * 9000)); S.user.history.unshift({n:-r.cost, why:`Redeemed: ${r.title}`, when:'Just now'}); render(); openSheet('reward', id); },
  copy(code){ navigator.clipboard?.writeText(code).then(() => toast('Code copied'), () => toast('Copy is blocked here. Select the code to copy it.')); },
  step(path, d){ const [o, k] = resolve(path); o[k] = Math.max(1, Math.min(30, o[k] + +d)); renderSheet(); },
  setv(path, v){ const [o, k] = resolve(path); o[k] = v; renderSheet(); },
  saveEdit(){ const p = plant(S.sheet.a); S.sheet = null; render(); toast(`Care plan updated for ${p.name}`); },
  setup(){
    S.sheet = {type:'setup', fresh:true, step:0, name:'', found:0, scanning:false, open:0, code:'SPROUT-' + (1000 + Math.floor(Math.random() * 9000)),
      plants:SCENE.map((sp, i) => { const k = plant(sp.id).kind, c = CARE[k]; return {name:`${c.species} ${i + 1}`, kind:k, pot:i, every:c.every, sun:c.sun, soil:c.soil, fert:c.fert, note:''}; })};
    renderSheet();
  },
  setupNext(){
    const sh = S.sheet;
    if (sh.step === 0 && !sh.name.trim()){ toast('Give the garden a name first'); document.getElementById('setup-name')?.focus(); return; }
    sh.step++; sh.fresh = false; renderSheet(); $('#sheet-root .sheet-body').scrollTop = 0;
  },
  setupScan(){
    const sh = S.sheet; sh.scanning = true; renderSheet();
    const tick = setInterval(() => {
      if (S.sheet !== sh){ clearInterval(tick); return; }
      sh.found++; if (sh.found >= SCENE.length){ sh.scanning = false; clearInterval(tick); }
      renderSheet();
    }, 550);
  },
  setupOpen(i){ S.sheet.open = +i; renderSheet(); },
  setupDone(){
    const sh = S.sheet, id = 'g' + (S.gardens.length + 1);
    S.gardens.unshift({id, name:sh.name.trim() || 'New garden', role:'supervisor', sup:S.user.name, dist:'0.1 km', beds:2, code:sh.code, about:'Set up with an AR scan.', people:[[S.user.name, 'You']], tasks:[]});
    S.gpins[id] = [226, 146];
    sh.plants.forEach((o, i) => S.plants.push(mk(id + 'p' + i, o.name.trim() || CARE[o.kind].species, o.kind, id, 1, {pot:o.pot, bed:'Bed ' + (i < 3 ? 1 : 2), every:o.every, sun:o.sun, soil:o.soil, fert:o.fert, note:o.note})));
    S.sheet = null; S.tab = 'gardens'; S.seg.gardens = 'mine'; S.nav.gardens = [{v:'garden', id}];
    render(true); earn(50, 'Set up a garden');
  },
};
const F = {
  give(id){
    const sh = S.sheet, i = S.inits.find(x => x.id === id), it = i.items[sh.item], qty = Math.min(sh.qty, it.need - it.got);
    if (qty <= 0) return toast('That one is already covered. Pick another crop.');
    const first = !i.yours, goals = iApply(i, sh.item, qty, S.user.handle);
    i.yours += qty; if (first) i.supporters++;
    const where = sh.via === 'ship' ? 'Ship it to ' + i.ship : 'Bring it to ' + i.drop[+sh.via].name;
    S.sheet = null; render(); earn(givePts(qty), `Pledged ${qty} ${it.name}`);
    setTimeout(() => toast(where), 600);
    iCelebrate(i, goals, i.mine);
  },
  newinit(){
    const sh = S.sheet, need = id => { document.getElementById(id)?.focus(); };
    const title = sh.title.trim(), items = sh.items.map(x => ({name:x.name.trim(), need:parseInt(x.need) || 0, got:0})).filter(x => x.name && x.need > 0);
    const drop = sh.drop.map(d => ({name:d.name.trim(), detail:d.detail.trim()})).filter(d => d.name), ship = sh.ship === 'yes' ? sh.address.trim() : '';
    if (!title){ toast('Give the initiative a name'); return need('ni-title'); }
    if (!items.length){ toast('Add at least one crop and how many you need'); return need('ni-item-0'); }
    if (sh.ship === 'yes' && !ship){ toast('Add a mailing address, or switch to drop-off only'); return need('ni-address'); }
    if (!drop.length && !ship){ toast('Add a drop-off location or accept shipping'); return need('ni-drop-0'); }
    const seen = new Set(), rewards = sh.rewards.map(r => ({pct:+r.pct, text:r.text.trim()})).filter(r => r.text && !seen.has(r.pct) && seen.add(r.pct));
    let ends = fromYmd(sh.ends); if (!ends || ends < dAhead(1)) ends = dAhead(28);
    const id = 'i' + Date.now();
    S.inits.unshift({id, title, about:sh.about.trim() || 'No description yet.', by:S.user.name, handle:S.user.handle, org:sh.org.trim() || S.user.name, unit:sh.unit, ends,
      items, drop, ship, ways:sh.ways.map(w => w.text.trim()).filter(Boolean).map(text => ({text, n:0, joined:false})), rewards, supporters:0, yours:0, mine:true, recent:[]});
    S.sheet = null; S.tab = 'community'; S.seg.community = 'init'; S.nav.community = [{v:'init', id}];
    render(true); earn(30, 'Started an initiative');
    setTimeout(() => iNeighbour(id), 5000);
  },
  soilVals(id, fd){
    const so = soilOf(id), vals = {};
    for (const k of Object.keys(SOIL_REF)){ const x = parseFloat(fd.get(k)); vals[k] = Number.isFinite(x) && x >= 0 ? x : (so.vals?.[k] ?? SOIL_SAMPLE[k]); }
    S.sheet = null; soilResults(id, vals, 'Entered by you, today');
  },
  recLoad(fd){ recLoad(fd.get('url') || '').then(recKick); },
  ask(kind, fd){ S.forum[kind].unshift({id:'q' + Date.now(), q:fd.get('text').trim(), by:S.user.handle, votes:1, voted:true, answers:[]}); S.sheet = null; render(); toast('Question posted to the forum'); },
  answer(kind, qid, fd){
    const q = S.forum[kind].find(x => x.id === qid), a = {by:S.user.handle, lvl:level(S.user.xp).name, text:fd.get('text').trim(), votes:0, voted:false, mine:true};
    q.answers.push(a); S.user.answers++; render(); earn(15, 'Answered a question');
    setTimeout(() => { a.votes++; S.user.upvotes++; S.user.pts += 5; S.user.xp += 5; S.user.history.unshift({n:5, why:'Upvote from @priya_plants', when:'Just now'}); toast('+5 points · @priya_plants upvoted your answer', 'pts'); render(); }, 3200);
  },
  post(fd){ S.posts.unshift({id:'p' + Date.now(), tag:fd.get('tag'), title:fd.get('title').trim(), body:fd.get('body').trim(), by:S.user.handle, lvl:level(S.user.xp).name, votes:1, my:1, age:0, comments:[]}); S.sheet = null; S.seg.sort = 'new'; S.seg.community = 'feed'; render(); earn(10, 'Shared a post'); },
  comment(pid, fd){ S.posts.find(x => x.id === pid).comments.push([S.user.handle, fd.get('text').trim()]); render(); earn(5, 'Commented'); },
  rename(pid, fd){ plant(pid).name = fd.get('name').trim() || plant(pid).name; S.sheet = null; render(); toast('Name saved'); },
  name(pid, fd){ const p = plant(pid); p.name = fd.get('name').trim(); if (!p.name) return; p.unnamed = false; p.mine = true; S.sheet = null; S.scan.sel = null; render(); earn(20, `${p.name} joined your buddies`); },
  log(gid, fd){
    const pid = fd.get('plant') || null, action = fd.get('action'), p = pid && plant(pid);
    if (p && action === 'Watered') p.last = 0;
    if (p && action === 'Fertilized') p.fed = 0;
    S.log.unshift({g:gid, plant:pid, action, who:'You', days:0, note:fd.get('note').trim()});
    S.user.tasks++; S.sheet = null; render(); earn(10, 'Logged garden care');
  },
};

/* ---------- events ---------- */
let lastEvt = null;
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  lastEvt = e;
  const [name, ...args] = el.dataset.a.split(':');
  A[name]?.(...args);
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('[data-a][tabindex]')){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', {bubbles:true})); }
  if (e.key === 'Escape' && S.sheet) A.close();
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const [name, ...args] = e.target.dataset.f.split(':');
  F[name]?.(...args, new FormData(e.target));
});
function bind(e){
  const t = e.target;
  if (t.dataset?.file !== undefined){
    if (e.type === 'change' && t.files?.[0]){ S.cam.photo = URL.createObjectURL(t.files[0]); S.cam.src = 'photo'; S.cam.marks = []; S.cam.tried = true; S.scan.sel = null; S.sheet = null; camPref(false); render(); }
    return;
  }
  if (t.dataset?.rec !== undefined){ S.rec.map[S.rec.labels[+t.dataset.rec]] = t.value; recSave(); recReset(); return; }
  if (t.dataset?.bind){ const [o, k] = resolve(t.dataset.bind); o[k] = t.value;
    if (S.sheet?.type === 'newinit'){ const el = document.getElementById('ni-total'); if (el) el.textContent = niTotal() + ' ' + S.sheet.unit; } }
  if (t.dataset?.filter){
    S.forumQ = t.value; const f = t.value.toLowerCase(); let n = 0;
    document.querySelectorAll('#' + t.dataset.filter + ' [data-text]').forEach(r => { const ok = r.dataset.text.includes(f); r.hidden = !ok; if (ok) n++; });
    const list = document.getElementById(t.dataset.filter); list.hidden = !n;
    document.getElementById(t.dataset.filter + '-empty').hidden = !!n;
  }
}
document.addEventListener('input', bind);
document.addEventListener('change', bind);
render();
</script>
